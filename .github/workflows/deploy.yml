name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ply
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
    # Same gate as ci.yml. A bump commit reaches this job through workflow_dispatch,
    # because a GITHUB_TOKEN push does not trigger on: push.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Fetch GitHub git dependencies over HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - name: Git identity for the test suite
        run: |
          git config --global user.name "ply-web"
          git config --global user.email "ply-web@example.com"
          git config --global commit.gpgsign false
      - run: npm ci
      - run: npm test
      - run: npx oxlint
      - run: npx tsc --noEmit

  deploy:
    permissions:
      contents: read
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - name: Require the Cloudflare secrets
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${CLOUDFLARE_API_TOKEN}" ] && missing+=("CLOUDFLARE_API_TOKEN")
          [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] && missing+=("CLOUDFLARE_ACCOUNT_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::notice title=Deploy skipped::Missing ${missing[*]}. Add the Actions secret on ivarvong/ply-web. wrangler was not run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Fetch GitHub git dependencies over HTTPS
        if: steps.creds.outputs.ready == 'true'
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - name: Install
        if: steps.creds.outputs.ready == 'true'
        run: npm ci
      - name: Deploy the ply Worker
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run worker:deploy
