name: Bump ply

on:
  repository_dispatch:
    types: [ply-main-updated]
  workflow_dispatch:
  schedule:
    # Daily fallback when ply's repository_dispatch does not arrive. 16:00 UTC.
    - cron: '0 16 * * *'

# The job permissions replace this default. contents: write pushes the pin.
# issues: write files a failed bump. This workflow does not deploy.
permissions:
  contents: read

concurrency:
  group: bump-ply
  cancel-in-progress: false

jobs:
  bump:
    permissions:
      contents: write # push the pin commit to main
      issues: write # open or comment on the bump-failed issue
    runs-on: ubuntu-24.04
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # cf needs Node ^22.23, ^24.22 or ^26.12. A bare major can resolve to an older cached release.
          node-version: 24.22
          cache: npm
      # package-lock resolves ply as git+ssh. Actions has no SSH key; the repo is public.
      - name: Fetch GitHub git dependencies over HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      # Annotated tags in the suite need a committer. The runner has none. Do not sign.
      - name: Git identity for the test suite
        run: |
          git config --global user.name "ply-web"
          git config --global user.email "ply-web@example.com"
          git config --global commit.gpgsign false
      - name: Resolve ply main and update the pin
        id: pin
        env:
          # repository_dispatch payload. Not interpolated into the script. Empty on cron and workflow_dispatch.
          CLIENT_PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          if [ -n "${CLIENT_PAYLOAD_SHA}" ] && ! [[ "${CLIENT_PAYLOAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "repository_dispatch client_payload.sha is not 40 lowercase hex" >&2
            exit 1
          fi
          git fetch origin main
          git checkout -B main origin/main
          sha=$(git ls-remote https://github.com/ivarvong/ply.git refs/heads/main | awk '{print $1}')
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ply main did not resolve to a 40-hex sha" >&2
            exit 1
          fi
          if [ -n "${CLIENT_PAYLOAD_SHA}" ] && [ "${CLIENT_PAYLOAD_SHA}" != "$sha" ]; then
            echo "client_payload.sha does not match ply main; the pin uses the resolved main"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          current=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const spec = JSON.parse(readFileSync("package.json", "utf8")).dependencies.ply ?? "";
            const match = /^github:ivarvong\/ply#([0-9a-f]{40})$/.exec(spec);
            if (!match) {
              console.error("package.json ply dependency is not an exact commit pin");
              process.exit(1);
            }
            console.log(match[1]);
          ')
          if [ "$sha" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ply pin is already $sha"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016 # JS template literal; the shell must not expand it
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const sha = process.argv[1];
            const path = "package.json";
            const text = readFileSync(path, "utf8");
            const next = text.replace(
              /("ply"\s*:\s*")github:ivarvong\/ply#[0-9a-f]{40}(")/,
              `$1github:ivarvong/ply#${sha}$2`,
            );
            if (next === text) {
              console.error("package.json pin was not updated");
              process.exit(1);
            }
            writeFileSync(path, next);
          ' "$sha"
          echo "pin moved to $sha"
      - name: Install, test, and dry-run the Worker build
        id: verify
        if: steps.pin.outputs.changed == 'true'
        env:
          PLY_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          # cf deploy --dry-run builds the Worker and validates it without credentials or API calls.
          # This workflow does not upload. An operator deploys.
          {
            npm install --no-audit --no-fund
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const sha = process.env.PLY_SHA;
              const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
              const resolved = lock.packages?.["node_modules/ply"]?.resolved ?? "";
              if (!resolved.endsWith("#" + sha)) {
                console.error("lockfile resolved ply to " + resolved);
                process.exit(1);
              }
            '
            npm test
            npx oxlint
            npm run typecheck
            npx cf deploy --dry-run
          } 2>&1 | tee "$RUNNER_TEMP/bump.log"
      - name: Commit the pin to main
        if: steps.pin.outputs.changed == 'true' && steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLY_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          extra=$(git status --porcelain | awk '{print $2}' | grep -vxE 'package.json|package-lock.json' || true)
          if [ -n "$extra" ]; then
            echo "refusing to commit unexpected paths:" >&2
            printf '%s\n' "$extra" >&2
            exit 1
          fi
          git add package.json package-lock.json
          git diff --cached --quiet && { echo "pin change produced no diff" >&2; exit 1; }
          subject=$(curl -fsSL -H "Accept: application/vnd.github+json" "https://api.github.com/repos/ivarvong/ply/commits/${PLY_SHA}" | node --input-type=module -e '
            let raw = "";
            process.stdin.on("data", (chunk) => { raw += chunk; });
            process.stdin.on("end", () => {
              try {
                const line = (JSON.parse(raw).commit?.message ?? "").split("\n")[0];
                console.log(line);
              } catch {
                console.log("");
              }
            });
          ' || true)
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "$(printf 'Pin ply to %s.\n\n%s\n' "$PLY_SHA" "$subject")"
          gh auth setup-git
          git push origin HEAD:main
      - name: Open an issue when the bump fails
        if: steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLY_SHA: ${{ steps.pin.outputs.sha }}
          TITLE: ply bump failed for ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from "node:fs";
          // GitHub issue bodies cap at 65536 characters. The tail leaves room for the header.
          const maxLogChars = 20000;
          const sha = process.env.PLY_SHA ?? "";
          let log = "";
          try {
            const raw = readFileSync(`${process.env.RUNNER_TEMP}/bump.log`);
            log = raw.subarray(Math.max(0, raw.length - maxLogChars)).toString("utf8");
          } catch {
            log = "(no log was written)";
          }
          const fence = "````";
          const body = [
            `The ply pin update to \`${sha}\` failed the test suite, Oxlint, \`npm run typecheck\`, or \`cf deploy --dry-run\`.`,
            "",
            "`main` was left unchanged. This workflow does not deploy.",
            "",
            fence,
            log,
            fence,
            "",
          ].join("\n");
          writeFileSync(`${process.env.RUNNER_TEMP}/issue.md`, body);
          JS
          existing=$(gh issue list --state open --limit 100 --json number,title | node --input-type=module -e '
            let raw = "";
            process.stdin.on("data", (chunk) => { raw += chunk; });
            process.stdin.on("end", () => {
              const title = process.env.TITLE;
              const hit = JSON.parse(raw).find((issue) => issue.title === title);
              if (hit) process.stdout.write(String(hit.number));
            });
          ')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi
